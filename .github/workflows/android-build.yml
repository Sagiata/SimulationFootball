name: Android CI & Auto Build

on:
  push:
    branches: [ main, master, develop ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:
    inputs:
      build_type:
        description: 'Build Type to Generate'
        required: true
        default: 'debug'
        type: choice
        options:
          - debug
          - release
          - all

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build & Test Android App
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/main' && github.ref != 'refs/heads/master' }}

      - name: Prepare Environment & Keystores
        run: |
          # Ensure .env file exists for Secrets Gradle Plugin
          if [ ! -f .env ] && [ -f .env.example ]; then
            cp .env.example .env
            echo "Created .env from .env.example"
          elif [ ! -f .env ]; then
            touch .env
            echo "Created empty .env"
          fi

          # Decode debug keystore if present
          if [ -f debug.keystore.base64 ]; then
            base64 -d debug.keystore.base64 > debug.keystore
            echo "Decoded debug.keystore from base64"
          fi

          # Make gradlew executable if present
          if [ -f ./gradlew ]; then
            chmod +x ./gradlew
          fi

      - name: Run Unit Tests
        run: |
          if [ -f ./gradlew ]; then
            ./gradlew testDebugUnitTest --continue --stacktrace
          else
            gradle :app:testDebugUnitTest --continue --stacktrace
          fi

      - name: Build Debug APK
        if: ${{ github.event.inputs.build_type == 'debug' || github.event.inputs.build_type == 'all' || github.event_name != 'workflow_dispatch' }}
        run: |
          if [ -f ./gradlew ]; then
            ./gradlew assembleDebug --stacktrace
          else
            gradle :app:assembleDebug --stacktrace
          fi

      - name: Build Release APK (if requested)
        if: ${{ github.event.inputs.build_type == 'release' || github.event.inputs.build_type == 'all' }}
        env:
          KEYSTORE_PATH: ${{ secrets.KEYSTORE_PATH }}
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          if [ -f ./gradlew ]; then
            ./gradlew assembleRelease --stacktrace || echo "Release signing key not configured, skipped release build."
          else
            gradle :app:assembleRelease --stacktrace || echo "Release signing key not configured, skipped release build."
          fi

      - name: Upload Test Reports
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: unit-test-reports
          path: app/build/reports/tests/
          retention-days: 7
          if-no-files-found: ignore

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        if: success()
        with:
          name: app-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 14
          if-no-files-found: ignore

      - name: Upload Release APK / Bundle (if available)
        uses: actions/upload-artifact@v4
        if: success() && (github.event.inputs.build_type == 'release' || github.event.inputs.build_type == 'all')
        with:
          name: app-release-artifacts
          path: |
            app/build/outputs/apk/release/*.apk
            app/build/outputs/bundle/release/*.aab
          retention-days: 14
          if-no-files-found: ignore
